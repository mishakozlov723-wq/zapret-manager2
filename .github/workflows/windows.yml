name: Windows prototype build
on:
  push:
    branches: [main, strategy-integration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tools
        run: npm install --no-audit --no-fund
      - name: Prepare app icons
        run: npx tauri icon app-icon.svg
      - name: Download official strategy test fixture
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Flowseal/zapret-discord-youtube/releases/download/1.10.4/zapret-discord-youtube-1.10.4.zip" -OutFile "$env:RUNNER_TEMP\zapret-fixture.zip"
          "ZAPRET_TEST_ZIP=$env:RUNNER_TEMP\zapret-fixture.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test checks
        working-directory: src-tauri
        run: cargo test
      - name: Test real service on isolated Windows runner
        working-directory: src-tauri
        shell: pwsh
        run: |
          $env:ZAPRET_SERVICE_TEST = "1"
          cargo test isolated_runner_service_lifecycle -- --nocapture
      - name: Build Windows installer
        run: npx tauri build
      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: zapret-manager-test
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Publish private test release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          Copy-Item $installer.FullName Zapret-Manager-Test-Setup.exe
          gh release create "test-${{ github.run_number }}" Zapret-Manager-Test-Setup.exe --prerelease --title "Тестовая версия ${{ github.run_number }}" --notes "Тест: стратегии, подключение и автозапуск через отдельную службу. Сначала проверь на своём компьютере."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
