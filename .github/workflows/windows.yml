name: Windows prototype build
on:
  push:
    branches: [main, strategy-integration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tools
        run: npm install --no-audit --no-fund
      - name: Prepare app icons
        run: npx tauri icon app-icon.svg
      - name: Download official strategy test fixture
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Flowseal/zapret-discord-youtube/releases/download/1.10.4/zapret-discord-youtube-1.10.4.zip" -OutFile "$env:RUNNER_TEMP\zapret-fixture.zip"
          "ZAPRET_TEST_ZIP=$env:RUNNER_TEMP\zapret-fixture.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test checks
        working-directory: src-tauri
        shell: bash
        run: cargo test 2>&1 | tee cargo-test.log
      - name: Share test log on failure
        if: failure()
        working-directory: src-tauri
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f cargo-test.log ] || exit 0
          grep -v '^ *Compiling ' cargo-test.log | tail -c 60000 | base64 -w0 > log.b64
          jq -n --rawfile c log.b64 --arg m "CI log $GITHUB_RUN_ID" '{message:$m, branch:"ci-status", content:$c}' > log.json
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/logs/$GITHUB_RUN_ID.txt" --input log.json > /dev/null
      - name: Test real service on isolated Windows runner
        working-directory: src-tauri
        shell: pwsh
        run: |
          $env:ZAPRET_SERVICE_TEST = "1"
          cargo test isolated_runner_service_lifecycle -- --nocapture
      - name: Build Windows installer
        run: npx tauri build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build user installer
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # Same as scripts/build-installer.mjs: the NSIS package must hold exactly target/release/zapret-manager.exe,
          # because the user installer checks the installed exe against that hash.
          npx tauri bundle --no-binary-patching
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsis = "src-tauri/target/release/bundle/nsis/Zapret Manager_${v}_x64-setup.exe"
          $probe = Join-Path $env:RUNNER_TEMP 'nsis-probe'
          7z x $nsis "-o$probe" -y | Out-Null
          $inner = Get-ChildItem $probe -Recurse -Filter zapret-manager.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $app = (Get-FileHash src-tauri/target/release/zapret-manager.exe -Algorithm SHA256).Hash
          if (-not $inner) { Write-Warning 'Could not extract the app from NSIS for the hash check' }
          elseif ((Get-FileHash $inner.FullName -Algorithm SHA256).Hash -ne $app) { throw 'NSIS package holds a different zapret-manager.exe than target/release' }
          else { Write-Host "NSIS app hash matches: $app" }
          dotnet publish installer/Setup.csproj -c Release -o dist "-p:Version=$v"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item dist/Zapret-Manager-Setup.exe).Length -lt 1000000) { throw 'Zapret-Manager-Setup.exe is missing or too small' }
      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: zapret-manager-test
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            dist/Zapret-Manager-Setup.exe
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A new version in tauri.conf.json becomes a real release: the app's "Check for updates" button finds it.
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$v" dist/Zapret-Manager-Setup.exe --title "Zapret Manager $v" --notes-file RELEASE_NOTES.md --latest --target $env:GITHUB_SHA
            exit $LASTEXITCODE
          }
          # Same version again: only a test build, it never reaches users.
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          Copy-Item $installer.FullName Zapret-Manager-Test-Setup.exe
          gh release create "test-$env:GITHUB_RUN_NUMBER" Zapret-Manager-Test-Setup.exe --prerelease --title "Тестовая версия $env:GITHUB_RUN_NUMBER" --notes "Тестовая сборка. Сначала проверь на своём компьютере."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
