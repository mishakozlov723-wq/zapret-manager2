name: Windows prototype build
on:
  push:
    branches: [main, strategy-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tools
        run: npm install --no-audit --no-fund
      - name: Prepare app icons
        run: npx tauri icon app-icon.svg
      - name: Download official strategy test fixture
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Flowseal/zapret-discord-youtube/releases/download/1.10.4/zapret-discord-youtube-1.10.4.zip" -OutFile "$env:RUNNER_TEMP\zapret-fixture.zip"
          "ZAPRET_TEST_ZIP=$env:RUNNER_TEMP\zapret-fixture.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test checks
        working-directory: src-tauri
        run: cargo test
      - name: Test real service on isolated Windows runner
        working-directory: src-tauri
        shell: pwsh
        run: |
          $env:ZAPRET_SERVICE_TEST = "1"
          cargo test isolated_runner_service_lifecycle -- --nocapture
      - name: Build Windows installer
        run: npx tauri build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build user installer
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          dotnet publish installer/Setup.csproj -c Release -o dist "-p:Version=$v"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item dist/Zapret-Manager-Setup.exe).Length -lt 1000000) { throw 'Setup is missing or too small' }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: zapret-manager-setup
          path: dist/Zapret-Manager-Setup.exe
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists, bump the version to publish"; exit 0 }
          gh release create $tag dist/Zapret-Manager-Setup.exe --title "Zapret Manager $env:APP_VERSION" --notes-file RELEASE_NOTES.md --latest --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
